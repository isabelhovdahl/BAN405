# BAN405 — the course environment
#
# Build it with:
#
#     conda env create -f environment.yml
#     conda activate ban405
#
# Every notebook in the second half of the course is written against this
# environment. If something in a lecture notebook does not run for you, the
# first thing to check is that this environment is the one that is active.
#
# Versions are pinned to a minor release (3.0 rather than 3.0.5). That is
# specific enough that everyone in the course gets the same behavior, and loose
# enough that a bug-fix release does not break the file.

name: ban405

channels:
  - conda-forge

dependencies:
  - python=3.12          # the interpreter
  - pandas=3.0           # tables
  - numpy=2.5            # arrays; the layer pandas is built on
  - matplotlib=3.11      # figures
  - statsmodels=0.14     # linear regression, and regression tables
  - openpyxl=3.1         # lets pandas read and write .xlsx files
  - tabulate=0.10        # lets DataFrame.to_markdown() work
  - ipykernel=7.3        # lets Positron run notebooks in this environment
