# BAN405 — the course environment
#
# Build it with:
#
#     conda env create -f environment.yml
#     conda activate ban405
#
# Every notebook in the second half of the course is written against this
# environment. If something in a lecture notebook does not run for you, the
# first thing to check is that this environment is the one that is active.
#
# Versions are pinned exactly, down to the bug-fix release. That is stricter
# than most projects need, and it is deliberate: everyone then runs identical
# software, so a number that appears on the screen at the front of the room
# appears the same way on your own laptop.

name: ban405

channels:
  - conda-forge

dependencies:

  # The interpreter
  - python=3.14.6

  # What the course uses directly
  - numpy=2.5.1            # arrays; the layer pandas is built on
  - pandas=3.0.3           # tables
  - matplotlib=3.11.0      # figures
  - statsmodels=0.15.0     # linear regression, and regression tables
  - openpyxl=3.1.5         # lets pandas read and write .xlsx files

  # Pulled in by statsmodels anyway; pinned so the version is known rather
  # than whatever the solver happened to choose on the day
  - scipy=1.18.0

  # Notebook machinery. Positron itself only needs ipykernel. The rest is here
  # so that `jupyter notebook` still works as a fallback if Positron ever 
  # refuses to start.
  - ipykernel=7.3.0        # lets Positron run notebooks in this environment
  - ipython=9.15.0
  - notebook=7.5.7
  - jupyter_server=2.20.0
  - jupyter_client=8.9.1
  - jupyter_core=5.9.1
